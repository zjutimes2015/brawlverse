<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOKER ADMIN — BRAWLVERSE</title>
<style>body{background:#0d0d0d;color:#eee;font-family:system-ui;max-width:900px;margin:0 auto;padding:20px}
h1{color:#fc0;letter-spacing:2px}.card{background:#161616;border:1px solid #333;border-radius:10px;padding:16px;margin:14px 0}
button{background:#fc0;border:0;border-radius:6px;padding:8px 16px;font-weight:700;cursor:pointer;margin:4px}
button.ghost{background:#333;color:#eee}input{background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:8px;margin:4px}
.bar{height:14px;background:#fc0;border-radius:4px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{color:#888;font-size:12px}</style>
</head><body><h1>🥊 BOOKER ADMIN</h1>
<div class="card"><div class="row"><input id="token" type="password" placeholder="Admin token" style="flex:1">
<button onclick="load()">Connect</button></div><p class="small">Token = ADMIN_TOKEN env var on Vercel.</p></div>
<div id="bouts"></div>
<div class="card"><h2>🎲 押注盘口</h2>
<div id="mkts"></div>
<div class="row"><input id="mk_id" placeholder="id (qf1-winner)"><input id="mk_bout" placeholder="bout_id (qf1)">
<input id="mk_q" placeholder="question" style="flex:1"></div>
<div class="row"><input id="mk_type" placeholder="winner|method|round" style="width:150px">
<input id="mk_sels" placeholder="selections, comma separated" style="flex:1">
<button onclick="addMarket()">开盘</button><button class="ghost" onclick="loadMkts()">刷新</button></div>
<p class="small">winner=押胜负 · method=押KO/判定 · round=押第几回合结束。称重仪式开盘，正赛开场锁盘，赛后结算。</p></div>
<div class="card"><h2>💬 观众字幕审核</h2>
<div class="row"><button onclick="loadCaps('pending')">待审核</button>
<button class="ghost" onclick="loadCaps('approved')">已通过</button>
<button class="ghost" onclick="loadCaps('rejected')">已拒绝</button></div>
<div id="caps"></div></div>
<script>
async function loadCaps(status){
  const rows = await api('/api/admin/captions?status='+status).catch(e=>{alert('Load failed: '+e.message);return null;});
  if(!rows) return;
  const box = document.getElementById('caps'); box.innerHTML='';
  if(!rows.length){ box.innerHTML='<p class="small">空</p>'; return; }
  for(const c of rows){
    const el = document.createElement('div'); el.className='row';
    el.style.cssText='border-bottom:1px solid #333;padding:8px 0';
    el.innerHTML = '<span>['+c.id+'] <b>'+esc(c.text)+'</b> <span class="small">— '+esc(c.nickname)+(c.pinned?' 📌':'')+'</span></span><span style="flex:1"></span>';
    const btn = (label, action, ghost) => {
      const b = document.createElement('button'); b.textContent = label;
      if(ghost) b.className='ghost';
      b.onclick = async () => { await api('/api/admin/captions?id='+c.id,{method:'PATCH',body:JSON.stringify({action})}); loadCaps(status); };
      el.appendChild(b);
    };
    if(status==='pending'){ btn('通过','approve'); btn('置顶','pin'); btn('拒绝','reject',true); }
    else if(status==='approved'){ btn(c.pinned?'取消置顶':'置顶', c.pinned?'unpin':'pin'); btn('拒绝','reject',true); }
    else { btn('恢复通过','approve'); }
    btn('删除','delete',true);
    box.appendChild(el);
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
async function loadMkts(){
  const d = await api('/api/admin/betting').catch(e=>{alert('Load failed: '+e.message);return null;});
  if(!d) return;
  const box = document.getElementById('mkts'); box.innerHTML='';
  if(!d.markets.length){ box.innerHTML='<p class="small">暂无盘口</p>'; return; }
  for(const m of d.markets){
    const el = document.createElement('div'); el.className='row';
    el.style.cssText='border-bottom:1px solid #333;padding:8px 0';
    const pools = Object.entries(m.pools).map(([k,v])=>k+':'+v).join(' ');
    el.innerHTML = '<span>['+esc(m.id)+'] <b>'+esc(m.question)+'</b> <span class="small">'+m.status+' · pool '+m.total_pool+' · '+esc(pools)+'</span></span><span style="flex:1"></span>';
    const btn = (label, body, ghost) => {
      const b = document.createElement('button'); b.textContent = label;
      if(ghost) b.className='ghost';
      b.onclick = async () => { await api('/api/admin/betting?id='+m.id,{method:'PATCH',body:JSON.stringify(body)}); loadMkts(); };
      el.appendChild(b);
    };
    if(m.status==='open'){ btn('锁盘',{action:'lock'},true); }
    if(m.status!=='settled'){
      const sel = document.createElement('select');
      sel.style.cssText='background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:8px;margin:4px';
      m.selections.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
      el.appendChild(sel);
      btn('结算',null); // placeholder replaced below
      el.lastChild.onclick = async () => { await api('/api/admin/betting?id='+m.id,{method:'PATCH',body:JSON.stringify({action:'settle',winning_selection:sel.value})}); loadMkts(); };
    }
    box.appendChild(el);
  }
}
async function addMarket(){
  const g=i=>document.getElementById(i).value;
  const sels=g('mk_sels').split(',').map(s=>s.trim()).filter(Boolean);
  await api('/api/admin/betting',{method:'POST',body:JSON.stringify({id:g('mk_id'),bout_id:g('mk_bout'),market_type:g('mk_type')||'winner',question:g('mk_q'),selections:sels})});
  loadMkts();
}
</script>
<script>
let TOKEN='';
async function api(path,opts){opts=opts||{};opts.headers=Object.assign({'X-Admin-Token':TOKEN,'Content-Type':'application/json'},opts.headers||{});
const r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text());return r.json();}
async function load(){TOKEN=document.getElementById('token').value;
const bouts=await api('/api/bouts').catch(e=>{alert('Load failed: '+e.message);return null;});if(!bouts)return;
const box=document.getElementById('bouts');box.innerHTML='';
for(const b of bouts){const t=await api('/api/votes/tally?bout_id='+b.id+'&round_no='+b.round_no).catch(()=>null);
const el=document.createElement('div');el.className='card';
const bars=t?Object.entries(t.tally).map(([k,v])=>{const p=t.total?Math.round(v/t.total*100):0;
return '<div>'+k.toUpperCase()+' — '+v+' ('+p+'%)<div class="bar" style="width:'+p+'%"></div></div>';}).join(''):'';
el.innerHTML='<h3>'+b.title+' <span class="small">['+b.id+'] R'+b.round_no+' '+(b.voting_open?'🟢 OPEN':'🔴 CLOSED')+'</span></h3><p>'+b.fighter_a+' vs '+b.fighter_b+'</p>'+bars+'<div class="row"><button onclick="toggleBout(\''+b.id+'\','+!b.voting_open+')">'+(b.voting_open?'Close voting':'Open voting')+'</button><button class="ghost" onclick="nextRound(\''+b.id+'\','+(b.round_no+1)+')">→ Round '+(b.round_no+1)+'</button></div>';
box.appendChild(el);}
const add=document.createElement('div');add.className='card';
add.innerHTML='<h3>+ New bout</h3><div class="row"><input id="nb_id" placeholder="id (qf5)"><input id="nb_title" placeholder="title"><input id="nb_a" placeholder="fighter A"><input id="nb_b" placeholder="fighter B"><button onclick="addBout()">Create</button></div>';
box.appendChild(add);}
async function toggleBout(id,open){await api('/api/admin/bouts?id='+id,{method:'PATCH',body:JSON.stringify({voting_open:open})});load();}
async function nextRound(id,r){await api('/api/admin/bouts?id='+id,{method:'PATCH',body:JSON.stringify({round_no:r,voting_open:true})});load();}
async function addBout(){const g=i=>document.getElementById(i).value;
await api('/api/admin/bouts',{method:'POST',body:JSON.stringify({id:g('nb_id'),title:g('nb_title'),fighter_a:g('nb_a'),fighter_b:g('nb_b'),voting_open:false})});load();}
</script></body></html>
